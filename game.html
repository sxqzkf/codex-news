<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101719">
  <title>弈境 · 智能五子棋</title>
  <link rel="icon" href="assets/gomoku-logo.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101719;
      --surface: #172124;
      --surface-2: #1E2B2E;
      --line: #314145;
      --text: #F3F6F5;
      --muted: #98A8A8;
      --teal: #36B7B1;
      --teal-dark: #16747A;
      --red: #E75A54;
      --gold: #E1B66A;
      --wood-1: #D5A66A;
      --wood-2: #B77D45;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, .32);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    body[data-bg="mist"] {
      color-scheme: light;
      --bg: #E7EEEC;
      --bg-grid: rgba(28,66,63,.055);
      --surface: #F7FAF9;
      --surface-2: #EAF1EF;
      --line: #B5C4C1;
      --text: #172528;
      --muted: #607170;
      --teal: #167D78;
      --teal-dark: #176B68;
      --red: #C64D48;
      --gold: #8D651F;
      --panel: rgba(247,250,249,.9);
      --control-bg: #DCE7E4;
      --control-hover: #CFDDDA;
      --history-bg: #E4EEEB;
      --history-line: #B7C7C4;
      --history-muted: #657674;
      --history-empty: #758785;
      --toast-bg: #183032;
      --toast-text: #F2F7F6;
      --shadow: 0 18px 50px rgba(37,62,61,.17);
    }
    body[data-bg="sunset"] {
      --bg: #2B1B21;
      --bg-grid: rgba(235,157,133,.05);
      --surface: #352129;
      --surface-2: #422831;
      --line: #68424D;
      --text: #FAF0EE;
      --muted: #CBAAB0;
      --teal: #39B8A7;
      --teal-dark: #176F68;
      --red: #E9685C;
      --gold: #E4B165;
      --panel: rgba(53,33,41,.9);
      --control-bg: #2A1920;
      --control-hover: #4B2D36;
      --history-bg: #2B1A21;
      --history-line: #65404B;
      --history-muted: #B9929A;
      --history-empty: #B08B93;
      --toast-bg: #F6E8E4;
      --toast-text: #382027;
      --shadow: 0 18px 50px rgba(15,5,9,.38);
    }
    body[data-bg="ocean"] {
      --bg: #13242B;
      --bg-grid: rgba(99,193,195,.05);
      --surface: #1B3036;
      --surface-2: #234047;
      --line: #38565D;
      --text: #EDF7F7;
      --muted: #9CB3B7;
      --teal: #4DC1C3;
      --teal-dark: #226D73;
      --red: #E86760;
      --gold: #DDB369;
      --panel: rgba(27,48,54,.9);
      --control-bg: #11252A;
      --control-hover: #294850;
      --history-bg: #13282D;
      --history-line: #345159;
      --history-muted: #78969B;
      --history-empty: #789398;
      --toast-bg: #E8F4F3;
      --toast-text: #12292D;
      --shadow: 0 18px 50px rgba(2,15,19,.38);
    }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(54,183,177,.55); outline-offset: 2px; }
    .app {
      width: min(1180px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(14px, 2.4vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 58px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 48px; height: 48px; flex: 0 0 auto; filter: drop-shadow(0 5px 12px rgba(0,0,0,.3)); }
    .brand h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); line-height: 1.1; font-weight: 760; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .score-strip {
      display: flex; align-items: center; gap: 7px; padding: 7px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }
    .score-item { min-width: 66px; padding: 6px 10px; text-align: center; border-right: 1px solid var(--line); }
    .score-item:last-child { border-right: 0; }
    .score-item span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .score-item strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
    .score-item.win strong { color: #62D5A1; }
    .score-item.loss strong { color: #F1847F; }
    .game-layout { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 318px; gap: 18px; align-items: start; }
    .play-area { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .status-bar {
      width: min(100%,760px); min-height: 46px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; padding: 8px 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .turn-status { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 680; font-size: 14px; }
    .turn-status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-stone {
      width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
      box-shadow: inset -3px -4px 6px rgba(0,0,0,.34), 0 2px 5px rgba(0,0,0,.3);
    }
    .mini-stone.black { background: radial-gradient(circle at 34% 28%,#596161,#161A1A 65%,#050606); }
    .mini-stone.white { background: radial-gradient(circle at 34% 28%,#fff,#E2E7E7 62%,#9FA9A9); }
    .thinking { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .thinking.active { color: var(--teal); }
    .board-frame {
      position: relative; width: min(100%,760px); aspect-ratio: 1;
      padding: clamp(9px,1.7vw,17px); border-radius: var(--radius);
      background:
        repeating-linear-gradient(102deg,rgba(76,43,22,.10) 0 2px,transparent 2px 17px),
        linear-gradient(145deg,var(--wood-1),var(--wood-2));
      box-shadow: var(--shadow), inset 0 0 0 2px rgba(87,49,25,.55);
      overflow: hidden; isolation: isolate;
    }
    .board-frame::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 38px rgba(76,42,20,.34); z-index: 4;
    }
    #board {
      position: relative; width: 100%; height: 100%; display: grid;
      grid-template-columns: repeat(15,1fr); grid-template-rows: repeat(15,1fr);
      background: rgba(255,235,193,.06); border: 1px solid rgba(82,48,27,.68);
      touch-action: manipulation;
    }
    .grid-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .cell { position: relative; z-index: 2; min-width: 0; min-height: 0; padding: 0; background: transparent; }
    .cell:hover::before {
      content: ""; position: absolute; width: 24%; aspect-ratio: 1; left: 38%; top: 38%;
      border-radius: 50%; background: rgba(54,183,177,.45);
      box-shadow: 0 0 0 4px rgba(54,183,177,.13);
    }
    .cell[data-color]::after {
      content: ""; position: absolute; inset: 7%; border-radius: 50%; transform: scale(.96);
      animation: drop .18s cubic-bezier(.2,.9,.3,1.25);
      box-shadow: inset -4px -6px 8px rgba(0,0,0,.36),inset 3px 3px 5px rgba(255,255,255,.15),0 4px 7px rgba(54,31,15,.42);
    }
    .cell[data-color="1"]::after { background: radial-gradient(circle at 34% 27%,#5B6363 0,#242A2A 43%,#090B0B 78%); }
    .cell[data-color="2"]::after {
      background: radial-gradient(circle at 34% 27%,#FFFFFF 0,#ECEFef 44%,#A5AFAF 82%);
      box-shadow: inset -4px -6px 8px rgba(96,110,110,.36),inset 3px 3px 5px rgba(255,255,255,.7),0 4px 7px rgba(54,31,15,.42);
    }
    .cell.last::before {
      content: ""; position: absolute; left: 44%; top: 44%; width: 12%; aspect-ratio: 1;
      border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(231,90,84,.22); z-index: 3;
    }
    .cell.winner::after {
      box-shadow: inset -4px -6px 8px rgba(0,0,0,.25),0 0 0 4px rgba(225,182,106,.9),0 0 17px rgba(255,221,143,.8);
      animation: winPulse .72s ease-in-out infinite alternate;
    }
    .cell.hint::after {
      content: ""; position: absolute; inset: 8%; border-radius: 50%;
      background: rgba(54,183,177,.38); border: 3px solid #73E2DD;
      animation: hintPulse .7s ease-in-out infinite alternate;
    }
    @keyframes drop { from { transform: scale(.55); opacity:.3; } to { transform: scale(.96); opacity:1; } }
    @keyframes winPulse { to { filter:brightness(1.2); transform:scale(1.04); } }
    @keyframes hintPulse { to { transform:scale(.84); opacity:.7; } }
    .board-caption { width: min(100%,760px); display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; }
    .sidebar {
      background: var(--panel); border:1px solid var(--line);
      border-radius: var(--radius); overflow:hidden; box-shadow:0 14px 35px rgba(0,0,0,.22);
    }
    .panel-section { padding:16px; border-bottom:1px solid var(--line); }
    .panel-section:last-child { border-bottom:0; }
    .section-title { margin:0 0 12px; color:var(--muted); font-size:11px; font-weight:760; text-transform:uppercase; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .section-heading .section-title { display:flex; align-items:center; gap:6px; }
    .tactic-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
    .tactic-btn {
      min-width:0; min-height:34px; padding:6px 4px; border-radius:5px;
      border:1px solid var(--line); background:var(--control-bg); color:var(--muted);
      font-size:11px; font-weight:680; white-space:nowrap;
    }
    .tactic-btn:hover { border-color:var(--teal); color:var(--text); }
    .tactic-btn.active { border-color:var(--teal); background:rgba(22,116,122,.22); color:var(--text); }
    .tactic-btn:disabled { opacity:.42; cursor:not-allowed; }
    .tactic-number { color:var(--gold); margin-right:3px; font-variant-numeric:tabular-nums; }
    .tactic-tip { margin:9px 0 0; color:var(--muted); font-size:11px; line-height:1.55; }
    .segmented {
      display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:4px;
      background:var(--control-bg); border:1px solid var(--line); border-radius:7px;
    }
    .segmented button {
      min-height:35px; padding:6px 8px; border-radius:5px; background:transparent;
      color:var(--muted); font-size:13px; font-weight:650;
    }
    .segmented button.active { background:var(--teal-dark); color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.25); }
    .choice-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .color-choice {
      min-height:54px; display:flex; align-items:center; justify-content:center; gap:9px;
      background:var(--control-bg); border:1px solid var(--line); border-radius:7px;
      color:var(--muted); font-size:13px; font-weight:650;
    }
    .color-choice.active { border-color:var(--teal); color:var(--text); background:rgba(22,116,122,.22); }
    .stone-swatch { width:21px; height:21px; border-radius:50%; }
    .stone-swatch.black { background:radial-gradient(circle at 34% 28%,#596161,#111 68%); }
    .stone-swatch.white { background:radial-gradient(circle at 34% 28%,#fff,#AEB8B8 72%); }
    .background-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .background-choice {
      position:relative; aspect-ratio:1.35; min-width:0; padding:4px;
      border-radius:7px; background:var(--control-bg); border:2px solid transparent;
    }
    .background-choice:hover { border-color:var(--muted); }
    .background-choice.active { border-color:var(--teal); box-shadow:0 0 0 2px rgba(54,183,177,.16); }
    .bg-preview {
      display:block; width:100%; height:100%; min-height:34px; border-radius:4px;
      border:1px solid rgba(255,255,255,.16);
    }
    .bg-preview.ink {
      background:
        linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),
        #101719;
      background-size:12px 12px;
    }
    .bg-preview.mist {
      background:
        linear-gradient(rgba(34,79,75,.1) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,79,75,.1) 1px,transparent 1px),
        #E7EEEC;
      background-size:12px 12px;
    }
    .bg-preview.sunset {
      background:
        linear-gradient(135deg,rgba(242,177,133,.18),transparent 58%),
        #2B1B21;
    }
    .bg-preview.ocean {
      background:
        linear-gradient(145deg,rgba(77,193,195,.18),transparent 56%),
        #13242B;
    }
    .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .action-btn {
      min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
      border-radius:7px; background:var(--surface-2); border:1px solid var(--line);
      font-size:13px; font-weight:680;
    }
    .action-btn:hover { background:var(--control-hover); }
    .action-btn.primary { background:var(--teal-dark); border-color:#27949A; }
    .action-btn.primary:hover { background:#1B858B; }
    .action-btn:disabled { opacity:.4; cursor:not-allowed; }
    .action-btn.wide { grid-column:1/-1; }
    .icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
    .history-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .history-head .section-title { margin:0; }
    .move-count { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    .move-list { height:154px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .move-empty { height:100%; display:grid; place-items:center; color:var(--history-empty); font-size:13px; }
    .move-item {
      display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:8px;
      min-height:31px; padding:5px 8px; background:var(--history-bg); border:1px solid var(--history-line);
      border-radius:5px; font-size:12px;
    }
    .move-item:last-child { border-color:rgba(54,183,177,.5); background:rgba(22,116,122,.16); }
    .move-index { color:var(--history-muted); font-variant-numeric:tabular-nums; }
    .move-player { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
    .move-tactic { color:var(--gold); font-size:10px; font-weight:680; }
    .move-dot { width:13px; height:13px; border-radius:50%; flex:0 0 auto; }
    .move-dot.black { background:#171B1B; border:1px solid #555; }
    .move-dot.white { background:#F0F3F3; border:1px solid #AAB; }
    .move-pos { color:var(--muted); font-family:"Cascadia Mono",Consolas,monospace; }
    .toast {
      position:fixed; left:50%; bottom:24px; z-index:20; transform:translate(-50%,18px);
      padding:10px 15px; background:var(--toast-bg); color:var(--toast-text); border-radius:7px;
      box-shadow:0 12px 30px rgba(0,0,0,.35); font-size:13px; font-weight:700;
      opacity:0; pointer-events:none; transition:.2s ease;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:900px) {
      .game-layout { grid-template-columns:1fr; }
      .sidebar { display:grid; grid-template-columns:1fr 1fr; }
      .panel-section { border-bottom:1px solid var(--line); }
      .panel-section:nth-child(odd) { border-right:1px solid var(--line); }
      .panel-section:last-child { grid-column:1/-1; border-right:0; }
      .move-list { height:126px; }
    }
    @media (max-width:600px) {
      .app { padding:10px; gap:12px; }
      .topbar { align-items:flex-start; }
      .brand img { width:40px; height:40px; }
      .brand p { display:none; }
      .score-item { min-width:48px; padding:5px 6px; }
      .score-item span { font-size:9px; }
      .score-item strong { font-size:16px; }
      .status-bar { min-height:42px; }
      .board-frame { padding:8px; }
      .board-caption span:last-child { display:none; }
      .sidebar { grid-template-columns:1fr; }
      .panel-section,.panel-section:nth-child(odd) { border-right:0; border-bottom:1px solid var(--line); }
      .panel-section:last-child { grid-column:auto; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body data-bg="ink">
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/gomoku-logo.svg" alt="">
        <div>
          <h1>弈境 · 智能五子棋</h1>
          <p>15 路棋盘 · 本地对弈 · 无需联网</p>
        </div>
      </div>
      <div class="score-strip" aria-label="对局比分">
        <div class="score-item win"><span>胜利</span><strong id="winScore">0</strong></div>
        <div class="score-item"><span>和棋</span><strong id="drawScore">0</strong></div>
        <div class="score-item loss"><span>失败</span><strong id="lossScore">0</strong></div>
      </div>
    </header>
    <div class="game-layout">
      <section class="play-area" aria-label="五子棋棋盘">
        <div class="status-bar" aria-live="polite">
          <div class="turn-status">
            <span class="mini-stone black" id="statusStone"></span>
            <span id="statusText">轮到你落子</span>
          </div>
          <span class="thinking" id="thinkingText">黑方先行</span>
        </div>
        <div class="board-frame">
          <div id="board" role="grid" aria-label="15乘15五子棋棋盘"></div>
        </div>
        <div class="board-caption">
          <span id="moveCaption">落子后将自动保存本局战绩</span>
          <span>五子连珠即可获胜</span>
        </div>
      </section>
      <aside class="sidebar">
        <section class="panel-section">
          <h2 class="section-title">电脑棋力</h2>
          <div class="segmented" id="difficultyGroup">
            <button type="button" data-level="easy">休闲</button>
            <button type="button" data-level="medium">进阶</button>
            <button type="button" data-level="hard">大师</button>
            <button type="button" data-level="deep" class="active">深度思考</button>
          </div>
        </section>
        <section class="panel-section" aria-labelledby="tacticTitle">
          <div class="section-heading">
            <h2 class="section-title" id="tacticTitle">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 17.5-8-8L3 6V3h3l3.5 3.5 8 8"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="m14.5 6.5 8-8L21 3l-3.5 3.5-8 8"/><path d="m5 14-4 4"/><path d="m3 19 2 2"/></svg>
              九式杀招
            </h2>
            <span class="move-count">实战识别</span>
          </div>
          <div class="tactic-grid" id="tacticGroup">
            <button type="button" class="tactic-btn" data-tactic="finisher" title="五子连珠，立即获胜"><span class="tactic-number">01</span>绝杀</button>
            <button type="button" class="tactic-btn" data-tactic="openFour" title="同一方向形成两个制胜点"><span class="tactic-number">02</span>活四</button>
            <button type="button" class="tactic-btn" data-tactic="doubleFour" title="两个方向各有制胜点"><span class="tactic-number">03</span>双冲四</button>
            <button type="button" class="tactic-btn" data-tactic="fourThree" title="一方向冲四，另一方向活三"><span class="tactic-number">04</span>四三杀</button>
            <button type="button" class="tactic-btn" data-tactic="doubleThree" title="两个方向均可转成活四"><span class="tactic-number">05</span>双活三</button>
            <button type="button" class="tactic-btn" data-tactic="rushFour" title="留有一个下一手制胜点"><span class="tactic-number">06</span>冲四</button>
            <button type="button" class="tactic-btn" data-tactic="jumpThree" title="形成带跳空的开放三子结构"><span class="tactic-number">07</span>跳三</button>
            <button type="button" class="tactic-btn" data-tactic="openThree" title="下一手可转成双端活四"><span class="tactic-number">08</span>活三</button>
            <button type="button" class="tactic-btn" data-tactic="counter" title="封堵对手制胜点并反击成形"><span class="tactic-number">09</span>反杀</button>
          </div>
          <p class="tactic-tip">点选招式，标记当前棋局中的安全应手；形成杀招时，落子记录会同步显示。</p>
        </section>
        <section class="panel-section">
          <h2 class="section-title">执子选择</h2>
          <div class="choice-row" id="colorGroup">
            <button type="button" class="color-choice active" data-color="1"><span class="stone-swatch black"></span>执黑</button>
            <button type="button" class="color-choice" data-color="2"><span class="stone-swatch white"></span>执白</button>
          </div>
        </section>
        <section class="panel-section">
          <h2 class="section-title">界面背景</h2>
          <div class="background-row" id="backgroundGroup">
            <button type="button" class="background-choice active" data-bg-theme="ink" aria-label="墨青背景" title="墨青"><span class="bg-preview ink"></span></button>
            <button type="button" class="background-choice" data-bg-theme="mist" aria-label="雾白背景" title="雾白"><span class="bg-preview mist"></span></button>
            <button type="button" class="background-choice" data-bg-theme="sunset" aria-label="霞金背景" title="霞金"><span class="bg-preview sunset"></span></button>
            <button type="button" class="background-choice" data-bg-theme="ocean" aria-label="深海背景" title="深海"><span class="bg-preview ocean"></span></button>
          </div>
        </section>
        <section class="panel-section">
          <h2 class="section-title">对局操作</h2>
          <div class="action-grid">
            <button type="button" class="action-btn primary" id="newGameBtn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>新对局
            </button>
            <button type="button" class="action-btn" id="undoBtn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>悔棋
            </button>
            <button type="button" class="action-btn" id="hintBtn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5A7 7 0 1 1 15.5 14.5c-.9.7-1.5 1.6-1.5 2.5h-4c0-.9-.6-1.8-1.5-2.5Z"/></svg>提示
            </button>
            <button type="button" class="action-btn" id="soundBtn" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="soundLabel">音效开</span>
            </button>
            <button type="button" class="action-btn wide" id="musicBtn" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span id="musicLabel">背景音乐开</span>
            </button>
          </div>

        <section class="panel-section">
          <div class="history-head">
            <h2 class="section-title">落子记录</h2>
            <span class="move-count" id="moveCount">0 手</span>
          </div>
          <div class="move-list" id="moveList" aria-live="polite"><div class="move-empty">尚未落子</div></div>
        </section>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      "use strict";
      const SIZE = 15;
      const EMPTY = 0;
      const HUMAN = 1;
      const AI = 2;
      const CENTER = 112;
      const STORAGE_KEY = "yijing-gomoku-state-v1";
      const COL_LABELS = "ABCDEFGHIJKLMNO";
      const WIN_SCORE = 1e9;
      const LEVEL_CONFIGS = Object.freeze({
        easy: Object.freeze({ label:"休闲棋力", searchDepth:1, rootCandidates:9, searchBranch:6, noise:1400, mistakeRate:.2, delay:260, timeLimit:0 }),
        medium: Object.freeze({ label:"进阶棋力", searchDepth:2, rootCandidates:12, searchBranch:8, noise:240, mistakeRate:.04, delay:340, timeLimit:260 }),
        hard: Object.freeze({ label:"大师棋力", searchDepth:4, rootCandidates:14, searchBranch:9, noise:0, mistakeRate:0, delay:520, timeLimit:850 }),
        deep: Object.freeze({ label:"深度思考", searchDepth:6, rootCandidates:16, searchBranch:10, noise:0, mistakeRate:0, delay:760, timeLimit:2600 })
      });
      const DIRECTIONS = [[1,0],[0,1],[1,1],[1,-1]];
      const TACTICS = Object.freeze({
        finisher: { name:"五连绝杀", weight:WIN_SCORE, description:"五子连珠，立即获胜" },
        openFour: { name:"活四", weight:115000, description:"同一方向形成两个制胜点" },
        doubleFour: { name:"双冲四", weight:130000, description:"两个方向各有制胜点" },
        fourThree: { name:"四三杀", weight:155000, description:"一方向冲四，另一方向活三" },
        doubleThree: { name:"双活三", weight:42000, description:"两个方向均可转成活四" },
        rushFour: { name:"冲四", weight:26000, description:"留有一个下一手制胜点" },
        jumpThree: { name:"跳三", weight:9500, description:"形成带跳空的开放三子结构" },
        openThree: { name:"活三", weight:8200, description:"下一手可转成双端活四" },
        counter: { name:"反杀", weight:18000, description:"封堵对手制胜点并反击成形" }
      });
      const TACTIC_PRIORITY = ["finisher","fourThree","doubleFour","openFour","doubleThree","rushFour","jumpThree","openThree","counter"];
      const boardEl = document.getElementById("board");
      const statusStone = document.getElementById("statusStone");
      const statusText = document.getElementById("statusText");
      const thinkingText = document.getElementById("thinkingText");
      const moveListEl = document.getElementById("moveList");
      const moveCountEl = document.getElementById("moveCount");
      const moveCaption = document.getElementById("moveCaption");
      const undoBtn = document.getElementById("undoBtn");
      const hintBtn = document.getElementById("hintBtn");
      const soundBtn = document.getElementById("soundBtn");
      const soundLabel = document.getElementById("soundLabel");
      const musicBtn = document.getElementById("musicBtn");
      const musicLabel = document.getElementById("musicLabel");
      const toastEl = document.getElementById("toast");
      let board = Array(SIZE * SIZE).fill(EMPTY);
      let moveHistory = [];
      let winCells = [];
      let turn = HUMAN;
      let gameOver = false;
      let thinking = false;
      let hintIndex = -1;
      let timerId = 0;
      let generation = 0;
      let playerColor = HUMAN;
      let aiColor = AI;
      let difficulty = "hard";
      let soundEnabled = true;
      let musicEnabled = true;
      let backgroundTheme = "ink";
      let scores = { win: 0, draw: 0, loss: 0 };
      let toastTimer = 0;
      let audioCtx = null;
      let musicGain = null;
      let musicTimer = 0;
      let musicStep = 0;
      let musicActive = false;
      let searchAborted = false;
      let activeTactic = "";
      const cells = [];
      const windows = [];
      const pointWindows = Array.from({ length: SIZE * SIZE }, () => []);

      buildWindows();
      createBoard();
      restoreSettings();
      bindControls();
      newGame();

      function buildWindows() {
        const directions = [[1,0],[0,1],[1,1],[1,-1]];
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            for (const dir of directions) {
              const dr = dir[0], dc = dir[1];
              const endRow = row + dr * 4;
              const endCol = col + dc * 4;
              if (endRow < 0 || endRow >= SIZE || endCol < 0 || endCol >= SIZE) continue;
              const line = [];
              for (let k = 0; k < 5; k++) {
                const idx = (row + dr * k) * SIZE + (col + dc * k);
                line.push(idx);
                pointWindows[idx].push(line);
              }
              windows.push(line);
            }
          }
        }
      }

      function createBoard() {
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("class", "grid-svg");
        svg.setAttribute("viewBox", "0 0 1500 1500");
        svg.setAttribute("aria-hidden", "true");
        for (let i = 0; i < SIZE; i++) {
          const pos = 50 + i * 100;
          const h = document.createElementNS(svgNS, "line");
          h.setAttribute("x1", "50"); h.setAttribute("y1", String(pos));
          h.setAttribute("x2", "1450"); h.setAttribute("y2", String(pos));
          h.setAttribute("stroke", "#5D3A24"); h.setAttribute("stroke-width", "3");
          h.setAttribute("vector-effect", "non-scaling-stroke"); svg.appendChild(h);
          const v = document.createElementNS(svgNS, "line");
          v.setAttribute("x1", String(pos)); v.setAttribute("y1", "50");
          v.setAttribute("x2", String(pos)); v.setAttribute("y2", "1450");
          v.setAttribute("stroke", "#5D3A24"); v.setAttribute("stroke-width", "3");
          v.setAttribute("vector-effect", "non-scaling-stroke"); svg.appendChild(v);
        }
        const stars = [[3,3],[3,11],[11,3],[11,11],[7,7]];
        for (const star of stars) {
          const dot = document.createElementNS(svgNS, "circle");
          dot.setAttribute("cx", String(50 + star[1] * 100));
          dot.setAttribute("cy", String(50 + star[0] * 100));
          dot.setAttribute("r", "9"); dot.setAttribute("fill", "#5D3A24"); svg.appendChild(dot);
        }
        boardEl.appendChild(svg);
        for (let idx = 0; idx < SIZE * SIZE; idx++) {
          const row = Math.floor(idx / SIZE), col = idx % SIZE;
          const cell = document.createElement("button");
          cell.type = "button"; cell.className = "cell"; cell.dataset.index = String(idx);
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", COL_LABELS[col] + (row + 1) + "，空位");
          cell.addEventListener("click", () => handleHumanMove(idx));
          cells.push(cell); boardEl.appendChild(cell);
        }
      }

      function restoreSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (saved.scores) scores = Object.assign({ win:0, draw:0, loss:0 }, saved.scores);
          difficulty = normalizeDifficulty(saved.difficulty);
          if ([HUMAN,AI].includes(saved.playerColor)) playerColor = saved.playerColor;
          if (typeof saved.soundEnabled === "boolean") soundEnabled = saved.soundEnabled;
          if (typeof saved.musicEnabled === "boolean") musicEnabled = saved.musicEnabled;
          if (["ink","mist","sunset","ocean"].includes(saved.backgroundTheme)) backgroundTheme = saved.backgroundTheme;
        } catch (_) {
          scores = { win:0, draw:0, loss:0 };
        }
        updateSettingsUI();
        updateScoreUI();
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            scores: scores, difficulty: difficulty, playerColor: playerColor, soundEnabled: soundEnabled, musicEnabled: musicEnabled, backgroundTheme: backgroundTheme
          }));
        } catch (_) {}
      }

      function updateSettingsUI() {
        document.querySelectorAll("#difficultyGroup button").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.level === difficulty);
        });
        document.querySelectorAll("#colorGroup button").forEach(btn => {
          btn.classList.toggle("active", Number(btn.dataset.color) === playerColor);
        });
        document.body.dataset.bg = backgroundTheme;
        document.querySelectorAll("#backgroundGroup button").forEach(btn => {
          const active = btn.dataset.bgTheme === backgroundTheme;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", String(active));
        });
        soundBtn.setAttribute("aria-pressed", String(soundEnabled));
        soundLabel.textContent = soundEnabled ? "音效开" : "音效关";
        musicBtn.setAttribute("aria-pressed", String(musicEnabled));
        musicLabel.textContent = musicEnabled ? "背景音乐开" : "背景音乐关";
      }

      function updateScoreUI() {
        document.getElementById("winScore").textContent = scores.win;
        document.getElementById("drawScore").textContent = scores.draw;
        document.getElementById("lossScore").textContent = scores.loss;
      }

      function bindControls() {
        document.getElementById("newGameBtn").addEventListener("click", newGame);
        document.getElementById("difficultyGroup").addEventListener("click", event => {
          const btn = event.target.closest("button[data-level]");
          if (!btn) return;
          difficulty = btn.dataset.level; updateSettingsUI(); persist(); newGame();
        });
        document.getElementById("tacticGroup").addEventListener("click", event => {
          const btn = event.target.closest("button[data-tactic]");
          if (!btn) return;
          showTacticHint(btn.dataset.tactic);
        });
        document.getElementById("colorGroup").addEventListener("click", event => {
          const btn = event.target.closest("button[data-color]");
          if (!btn) return;
          playerColor = Number(btn.dataset.color); aiColor = playerColor === HUMAN ? AI : HUMAN;
          updateSettingsUI(); persist(); newGame();
        });
        document.getElementById("backgroundGroup").addEventListener("click", event => {
          const btn = event.target.closest("button[data-bg-theme]");
          if (!btn) return;
          backgroundTheme = btn.dataset.bgTheme;
          updateSettingsUI(); persist();
          const names = { ink:"墨青", mist:"雾白", sunset:"霞金", ocean:"深海" };
          showToast("已切换至" + names[backgroundTheme] + "背景");
        });
        undoBtn.addEventListener("click", undo);
        hintBtn.addEventListener("click", showHint);
        soundBtn.addEventListener("click", () => {
          soundEnabled = !soundEnabled; updateSettingsUI(); persist();
          if (soundEnabled) playTone(520,.06,"sine",.04);
        });
        musicBtn.addEventListener("click", () => {
          musicEnabled = !musicEnabled; updateSettingsUI(); persist();
          if (musicEnabled) {
            startBackgroundMusic();
            showToast("背景音乐已开启");
          } else {
            stopBackgroundMusic();
            showToast("背景音乐已关闭");
          }
        });
        const unlockMusic = () => startBackgroundMusic();
        document.addEventListener("pointerdown", unlockMusic, { once:true });
        document.addEventListener("keydown", unlockMusic, { once:true });
        window.addEventListener("keydown", event => {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
            event.preventDefault(); undo();
          }
          if (event.key.toLowerCase() === "h" && !event.ctrlKey && !event.metaKey) showHint();
        });
      }

      function newGame() {
        generation++; clearTimeout(timerId);
        board = Array(SIZE * SIZE).fill(EMPTY); moveHistory = []; winCells = [];
        hintIndex = -1; activeTactic = ""; gameOver = false; thinking = false;
        aiColor = playerColor === HUMAN ? AI : HUMAN; turn = HUMAN; render();
        if (playerColor === AI) scheduleAI();
        moveCaption.textContent = playerColor === HUMAN ? "你执黑棋，黑方先行" : "你执白棋，电脑执黑先行";
        startBackgroundMusic();
        playTone(360,.07,"sine",.035);
      }

      function handleHumanMove(idx) {
        if (gameOver || thinking || turn !== playerColor || board[idx] !== EMPTY) return;
        clearHint(); placeStone(idx, playerColor);
        if (resolveAfterMove(idx, playerColor)) return;
        turn = aiColor; render(); scheduleAI();
      }

      function scheduleAI() {
        if (gameOver || turn !== aiColor) return;
        thinking = true; render();
        const token = generation;
        const delay = getLevelConfig().delay;
        timerId = setTimeout(() => {
          if (token !== generation || gameOver || turn !== aiColor) return;
          const move = chooseAIMove();
          if (move < 0) { finishDraw(); return; }
          thinking = false; placeStone(move, aiColor);
          if (resolveAfterMove(move, aiColor)) return;
          turn = playerColor; render();
        }, delay);
      }

      function placeStone(idx, color) {
        board[idx] = color;
        const analysis = analyzeMove(idx, color);
        moveHistory.push({ idx: idx, color: color, tactics: analysis.ids });
        hintIndex = -1; activeTactic = "";
        if (analysis.ids.length) {
          const label = formatTacticNames(analysis.ids);
          moveCaption.textContent = (color === playerColor ? "你" : "电脑") + "使出「" + label + "」";
          if (color === playerColor && !analysis.ids.includes("finisher")) showToast("杀招成形 · " + label);
        } else {
          moveCaption.textContent = "第 " + moveHistory.length + " 手落定，继续布局";
        }
        playTone(color === HUMAN ? 430 : 560,.055,"sine",.045);
      }

      function resolveAfterMove(idx, color) {
        const line = findWin(idx, color);
        if (line) {
          winCells = line; gameOver = true; thinking = false; stopBackgroundMusic();
          if (color === playerColor) {
            scores.win++; showToast("漂亮的五子连珠，你赢了！"); playVictory(true);
          } else {
            scores.loss++; showToast("电脑完成五子连珠，再接再厉"); playVictory(false);
          }
          persist(); updateScoreUI(); render(); return true;
        }
        if (moveHistory.length === SIZE * SIZE) { finishDraw(); return true; }
        return false;
      }

      function finishDraw() {
        gameOver = true; thinking = false; stopBackgroundMusic(); scores.draw++;
        persist(); updateScoreUI(); showToast("棋盘已满，本局和棋"); render();
      }

      function findWin(idx, color) {
        const directions = [[1,0],[0,1],[1,1],[1,-1]];
        const row = Math.floor(idx / SIZE), col = idx % SIZE;
        for (const dir of directions) {
          const dr = dir[0], dc = dir[1], line = [idx];
          for (let step = 1; step < 5; step++) {
            const r = row + dr * step, c = col + dc * step;
            if (!inBounds(r,c) || board[r * SIZE + c] !== color) break;
            line.push(r * SIZE + c);
          }
          for (let step = 1; step < 5; step++) {
            const r = row - dr * step, c = col - dc * step;
            if (!inBounds(r,c) || board[r * SIZE + c] !== color) break;
            line.unshift(r * SIZE + c);
          }
          if (line.length >= 5) return line;
        }
        return null;
      }

      function wouldWin(idx, color) {
        const directions = [[1,0],[0,1],[1,1],[1,-1]];
        const row = Math.floor(idx / SIZE), col = idx % SIZE;
        for (const dir of directions) {
          const dr = dir[0], dc = dir[1]; let count = 1;
          for (let sign = -1; sign <= 1; sign += 2) {
            for (let step = 1; step < 5; step++) {
              const r = row + dr * step * sign, c = col + dc * step * sign;
              if (!inBounds(r,c) || board[r * SIZE + c] !== color) break;
              count++;
            }
          }
          if (count >= 5) return true;
        }
        return false;
      }

      function normalizeDifficulty(value) {
        return Object.prototype.hasOwnProperty.call(LEVEL_CONFIGS, value) ? value : "deep";
      }

      function getLevelConfig() {
        return LEVEL_CONFIGS[normalizeDifficulty(difficulty)];
      }

      function getOpponentColor(color) {
        return color === aiColor ? playerColor : aiColor;
      }

      function findImmediateWinningMoves(color, pool) {
        const emptyCells = pool || getNearbyEmpty();
        return emptyCells.filter(idx => board[idx] === EMPTY && wouldWin(idx, color));
      }

      function isMoveSafeForColor(idx, color) {
        if (board[idx] !== EMPTY) return false;
        board[idx] = color;
        const winsImmediately = wouldWin(idx, color);
        const opponentReplies = winsImmediately ? [] : findImmediateWinningMoves(getOpponentColor(color));
        board[idx] = EMPTY;
        return winsImmediately || opponentReplies.length === 0;
      }

      function chooseAIMove() {
        const config = getLevelConfig();
        const nearby = getNearbyEmpty();
        if (!nearby.length) return -1;

        const winningMoves = findImmediateWinningMoves(aiColor, nearby);
        if (winningMoves.length) {
          return winningMoves.sort((a,b) => centerDistance(a) - centerDistance(b))[0];
        }

        const opponentWinningMoves = findImmediateWinningMoves(playerColor, nearby);
        if (opponentWinningMoves.length === 1) return opponentWinningMoves[0];

        const candidates = getCandidates(aiColor, config.rootCandidates, true);
        if (!candidates.length) {
          return nearby.sort((a,b) => centerDistance(a) - centerDistance(b))[0];
        }

        const safeMoves = candidates.filter(item => isMoveSafeForColor(item.idx, aiColor));
        const legalMoves = safeMoves.length ? safeMoves : candidates;

        if (config.searchDepth <= 1) {
          return chooseEasyMove(legalMoves, config);
        }
        return searchBestMove(legalMoves, config);
      }

      function chooseEasyMove(moves, config) {
        const scored = moves.map(item => ({
          idx:item.idx,
          score:item.score + Math.random() * config.noise
        })).sort((a,b) => b.score - a.score);

        if (Math.random() < config.mistakeRate && scored.length > 2) {
          const alternateCount = Math.min(3, scored.length) - 1;
          const offset = 1 + Math.floor(Math.random() * alternateCount);
          return scored[offset].idx;
        }
        return scored[0].idx;
      }

      function searchBestMove(rootMoves, config) {
        const deadline = Date.now() + config.timeLimit;
        let ordered = rootMoves.slice(0, config.rootCandidates);
        let bestMove = ordered[0].idx;

        for (let depth = 1; depth <= config.searchDepth; depth++) {
          searchAborted = false;
          let iterationBest = ordered[0].idx;
          let iterationScore = -Infinity;
          let alpha = -Infinity;
          const scored = [];

          for (const item of ordered) {
            board[item.idx] = aiColor;
            let score;
            if (wouldWin(item.idx, aiColor)) score = WIN_SCORE;
            else score = minimax(depth - 1, alpha, Infinity, playerColor, 1, deadline, config.searchBranch);
            board[item.idx] = EMPTY;

            scored.push({ idx:item.idx, score:score });
            if (score > iterationScore) {
              iterationScore = score;
              iterationBest = item.idx;
            }
            alpha = Math.max(alpha, iterationScore);
            if (searchAborted) break;
          }

          if (!searchAborted || depth === 1) bestMove = iterationBest;
          if (searchAborted || Date.now() >= deadline - 40) break;

          scored.sort((a,b) => b.score - a.score);
          ordered = scored.map(item => ({ idx:item.idx, score:item.score }));
        }
        return bestMove;
      }

      function minimax(depth, alpha, beta, side, ply, deadline, branchLimit) {
        if (Date.now() >= deadline) {
          searchAborted = true;
          return evaluateGlobal();
        }
        if (depth <= 0) return evaluateGlobal();

        const maximizing = side === aiColor;
        const candidates = getSearchCandidates(side, branchLimit);
        if (!candidates.length) return evaluateGlobal();

        let best = maximizing ? -Infinity : Infinity;
        for (const item of candidates) {
          board[item.idx] = side;
          let score;
          if (wouldWin(item.idx, side)) {
            score = side === aiColor ? WIN_SCORE - ply : -WIN_SCORE + ply;
          } else {
            score = minimax(depth - 1, alpha, beta, getOpponentColor(side), ply + 1, deadline, branchLimit);
          }
          board[item.idx] = EMPTY;

          if (maximizing) {
            best = Math.max(best, score);
            alpha = Math.max(alpha, best);
          } else {
            best = Math.min(best, score);
            beta = Math.min(beta, best);
          }
          if (beta <= alpha || searchAborted) break;
        }
        return best;
      }

      function wouldWinInDirection(idx, color, direction) {
        const dr = direction[0];
        const dc = direction[1];
        const row = Math.floor(idx / SIZE);
        const col = idx % SIZE;
        let count = 1;
        for (let sign = -1; sign <= 1; sign += 2) {
          for (let step = 1; step < 5; step++) {
            const r = row + dr * step * sign;
            const c = col + dc * step * sign;
            if (!inBounds(r,c) || board[r * SIZE + c] !== color) break;
            count++;
          }
        }
        return count >= 5;
      }

      function getWinningPointsByDirection(color, pool) {
        return DIRECTIONS.map(direction => ({
          direction:direction,
          points:pool.filter(idx => board[idx] === EMPTY && wouldWinInDirection(idx, color, direction))
        }));
      }

      function getLiveThreeDirections(color, pool) {
        const liveDirections = new Set();
        for (const point of pool) {
          if (board[point] !== EMPTY) continue;
          board[point] = color;
          const nextWins = getWinningPointsByDirection(color, pool);
          board[point] = EMPTY;
          nextWins.forEach((item, directionIndex) => {
            if (item.points.length >= 2) liveDirections.add(directionIndex);
          });
        }
        return Array.from(liveDirections).sort((a,b) => a-b);
      }

      function hasJumpThree(idx, color) {
        const row = Math.floor(idx / SIZE);
        const col = idx % SIZE;
        for (const direction of DIRECTIONS) {
          const dr = direction[0];
          const dc = direction[1];
          for (let start = -5; start <= 0; start++) {
            const values = [];
            for (let offset = 0; offset < 6; offset++) {
              const step = start + offset;
              const r = row + dr * step;
              const c = col + dc * step;
              if (!inBounds(r,c)) values.push(2);
              else values.push(board[r * SIZE + c] === color ? 1 : board[r * SIZE + c] === EMPTY ? 0 : 2);
            }
            const ownCount = values.filter(value => value === 1).length;
            const middle = values.slice(1,5).join("");
            if (ownCount === 3 && values[0] === 0 && values[5] === 0 && (middle === "1011" || middle === "1101")) return true;
          }
        }
        return false;
      }

      function analyzeMove(idx, color) {
        if (board[idx] !== color) return { ids:[], score:0 };
        if (findWin(idx, color)) return { ids:["finisher"], score:TACTICS.finisher.weight };

        const pool = getNearbyEmpty();
        const wins = getWinningPointsByDirection(color, pool);
        const fourDirections = wins.filter(item => item.points.length > 0).map(item => DIRECTIONS.indexOf(item.direction));
        const liveThreeDirections = getLiveThreeDirections(color, pool);
        const independentThrees = liveThreeDirections.filter(direction => !fourDirections.includes(direction));
        const ids = [];

        if (fourDirections.length && independentThrees.length) ids.push("fourThree");
        if (fourDirections.length >= 2) ids.push("doubleFour");
        if (wins.some(item => item.points.length >= 2)) ids.push("openFour");
        if (liveThreeDirections.length >= 2) ids.push("doubleThree");
        if (fourDirections.length) ids.push("rushFour");
        if (hasJumpThree(idx, color)) ids.push("jumpThree");
        if (liveThreeDirections.length) ids.push("openThree");
        if (wouldWin(idx, getOpponentColor(color)) && (fourDirections.length || liveThreeDirections.length)) ids.push("counter");

        return {
          ids:TACTIC_PRIORITY.filter(id => ids.includes(id)),
          score:ids.reduce((total,id) => total + TACTICS[id].weight, 0)
        };
      }

      function formatTacticNames(ids, limit) {
        const maxNames = limit || 2;
        return TACTIC_PRIORITY.filter(id => ids.includes(id)).slice(0,maxNames).map(id => TACTICS[id].name).join(" · ");
      }

      function findTacticalMove(tacticId, color) {
        if (!TACTICS[tacticId]) return -1;
        let bestMove = -1;
        let bestScore = -Infinity;
        for (const idx of getNearbyEmpty()) {
          if (board[idx] !== EMPTY) continue;
          board[idx] = color;
          const analysis = analyzeMove(idx, color);
          board[idx] = EMPTY;
          if (!analysis.ids.includes(tacticId) || !isMoveSafeForColor(idx, color)) continue;
          const score = analysis.score - centerDistance(idx);
          if (score > bestScore) {
            bestScore = score;
            bestMove = idx;
          }
        }
        return bestMove;
      }

      function showTacticHint(tacticId) {
        if (gameOver || thinking || turn !== playerColor) {
          showToast("请等待你的回合再使用杀招提示"); return;
        }
        const move = findTacticalMove(tacticId, playerColor);
        if (move < 0) {
          activeTactic = ""; render();
          showToast(TACTICS[tacticId].name + "：" + TACTICS[tacticId].description + "，当前无安全应手");
          return;
        }
        hintIndex = move;
        activeTactic = tacticId;
        render();
        const message = TACTICS[tacticId].name + " · 建议落在 " + positionLabel(move);
        moveCaption.textContent = message;
        showToast(message);
        playTone(780,.09,"triangle",.04);
        setTimeout(clearHint, 3200);
      }

      function getCandidates(color, limit, includeTactics) {
        const opponent = getOpponentColor(color);
        const emptyCells = getNearbyEmpty();
        if (!emptyCells.length) return [];

        const scored = emptyCells.map(idx => {
          const ownGain = evaluatePlacement(idx, color);
          const oppGain = includeTactics ? evaluatePlacement(idx, opponent) : 0;
          const winBonus = wouldWin(idx, color) ? WIN_SCORE : 0;
          const blockBonus = includeTactics && wouldWin(idx, opponent) ? WIN_SCORE * .8 : 0;
          const centerBonus = Math.max(0, 18 - centerDistance(idx) * 2);
          return { idx:idx, score:ownGain + oppGain * .94 + winBonus + blockBonus + centerBonus };
        });

        scored.sort((a,b) => b.score - a.score || centerDistance(a.idx) - centerDistance(b.idx));
        return scored.slice(0, limit).map(item => {
          board[item.idx] = color;
          const analysis = analyzeMove(item.idx, color);
          board[item.idx] = EMPTY;
          return { idx:item.idx, score:item.score + analysis.score, tactics:analysis.ids };
        }).sort((a,b) => b.score - a.score || centerDistance(a.idx) - centerDistance(b.idx));
      }

      function getSearchCandidates(color, limit) {
        const opponent = getOpponentColor(color);
        const emptyCells = getNearbyEmpty();
        if (!emptyCells.length) return [];

        const scored = emptyCells.map(idx => {
          const own = quickMoveScore(idx, color);
          const block = quickMoveScore(idx, opponent) * .92;
          const winBonus = wouldWin(idx, color) ? WIN_SCORE : 0;
          const blockBonus = wouldWin(idx, opponent) ? WIN_SCORE * .82 : 0;
          return {
            idx:idx,
            score:own + block + winBonus + blockBonus + Math.max(0, 12 - centerDistance(idx))
          };
        });

        scored.sort((a,b) => b.score - a.score || centerDistance(a.idx) - centerDistance(b.idx));
        return scored.slice(0, limit);
      }

      function quickMoveScore(idx, color) {
        const opponent = getOpponentColor(color);
        let own = 0;
        let block = 0;
        for (const line of pointWindows[idx]) {
          let ownCount = 0;
          let opponentCount = 0;
          for (const point of line) {
            if (board[point] === color) ownCount++;
            else if (board[point] === opponent) opponentCount++;
          }
          if (opponentCount === 0) own += placementValue(ownCount + 1);
          if (ownCount === 0) block += placementValue(opponentCount + 1);
        }
        return own + block * .86;
      }

      function evaluatePlacement(idx, color) {
        if (board[idx] !== EMPTY) return -Infinity;
        board[idx] = color;
        let total = 0;
        for (const line of pointWindows[idx]) total += scoreWindow(line, color);
        board[idx] = EMPTY;
        return total;
      }

      function scoreWindow(line, color) {
        let own = 0;
        let opponent = 0;
        for (const idx of line) {
          if (board[idx] === color) own++;
          else if (board[idx] !== EMPTY) opponent++;
        }
        if (opponent > 0) return own * own * 2;
        return placementValue(own);
      }

      function placementValue(count) {
        if (count >= 5) return 1e7;
        if (count === 4) return 16000;
        if (count === 3) return 1800;
        if (count === 2) return 190;
        if (count === 1) return 18;
        return 0;
      }

      function evaluateGlobal() {
        const directions = [[1,0],[0,1],[1,1],[1,-1]];
        let score = 0;

        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            const idx = row * SIZE + col;
            const color = board[idx];
            if (color === EMPTY) continue;

            for (const direction of directions) {
              const dr = direction[0];
              const dc = direction[1];
              const previousRow = row - dr;
              const previousCol = col - dc;
              if (inBounds(previousRow, previousCol) && board[previousRow * SIZE + previousCol] === color) continue;

              let count = 1;
              let nextRow = row + dr;
              let nextCol = col + dc;
              while (inBounds(nextRow, nextCol) && board[nextRow * SIZE + nextCol] === color) {
                count++;
                nextRow += dr;
                nextCol += dc;
              }

              const beforeOpen = inBounds(previousRow, previousCol) && board[previousRow * SIZE + previousCol] === EMPTY;
              const afterOpen = inBounds(nextRow, nextCol) && board[nextRow * SIZE + nextCol] === EMPTY;
              const openEnds = Number(beforeOpen) + Number(afterOpen);
              const value = runValue(count, openEnds);
              score += color === aiColor ? value : -value * 1.04;
            }
          }
        }

        for (const line of windows) {
          let ai = 0;
          let human = 0;
          for (const idx of line) {
            if (board[idx] === aiColor) ai++;
            else if (board[idx] === playerColor) human++;
          }
          if (ai && !human) score += threatWindowValue(ai);
          else if (human && !ai) score -= threatWindowValue(human) * 1.04;
        }

        for (let idx = 0; idx < board.length; idx++) {
          const centerValue = Math.max(0, 8 - centerDistance(idx)) * .35;
          if (board[idx] === aiColor) score += centerValue;
          else if (board[idx] === playerColor) score -= centerValue;
        }
        return score;
      }

      function runValue(count, openEnds) {
        if (count >= 5) return WIN_SCORE * .8;
        if (count === 4) return openEnds === 2 ? 52000 : 10500;
        if (count === 3) return openEnds === 2 ? 6200 : 760;
        if (count === 2) return openEnds === 2 ? 240 : 38;
        if (count === 1) return openEnds === 2 ? 12 : 2;
        return 0;
      }

      function threatWindowValue(count) {
        if (count === 5) return WIN_SCORE * .85;
        if (count === 4) return 13500;
        if (count === 3) return 1350;
        if (count === 2) return 125;
        if (count === 1) return 10;
        return 0;
      }

      function getNearbyEmpty() {
        const result = [];
        const seen = new Uint8Array(SIZE * SIZE);
        const occupied = [];
        for (let idx = 0; idx < board.length; idx++) {
          if (board[idx] !== EMPTY) occupied.push(idx);
        }
        if (!occupied.length) occupied.push(CENTER);
        for (const idx of occupied) {
          const row = Math.floor(idx / SIZE), col = idx % SIZE;
          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const r = row + dr, c = col + dc;
              if (!inBounds(r,c)) continue;
              const next = r * SIZE + c;
              if (board[next] === EMPTY && !seen[next]) { seen[next] = 1; result.push(next); }
            }
          }
        }
        return result;
      }

      function centerDistance(idx) {
        const row = Math.floor(idx / SIZE), col = idx % SIZE;
        return Math.abs(row - 7) + Math.abs(col - 7);
      }

      function inBounds(row, col) {
        return row >= 0 && row < SIZE && col >= 0 && col < SIZE;
      }

      function showHint() {
        activeTactic = "";
        if (gameOver || thinking || turn !== playerColor) {
          showToast("请等待当前回合结束后再使用提示"); return;
        }
        const candidates = getCandidates(playerColor, 1, true);
        if (!candidates.length) return;
        hintIndex = candidates[0].idx; render();
        showToast("建议落在 " + positionLabel(hintIndex));
        playTone(740,.08,"triangle",.035);
        setTimeout(clearHint, 2800);
      }

      function clearHint() {
        hintIndex = -1;
        activeTactic = "";
        cells.forEach(cell => cell.classList.remove("hint"));
        document.querySelectorAll("#tacticGroup button").forEach(btn => btn.classList.remove("active"));
      }

      function undo() {
        if (gameOver) { showToast("本局已结束，请开始新对局"); return; }
        if (!moveHistory.length) { showToast("当前没有可撤销的落子"); return; }
        generation++; clearTimeout(timerId); thinking = false; gameOver = false;
        winCells = []; hintIndex = -1;
        let lastHuman = -1;
        for (let i = moveHistory.length - 1; i >= 0; i--) {
          if (moveHistory[i].color === playerColor) { lastHuman = i; break; }
        }
        if (lastHuman < 0) { showToast("还没有你的落子可以撤销"); render(); return; }
        for (let i = moveHistory.length - 1; i >= lastHuman; i--) board[moveHistory[i].idx] = EMPTY;
        moveHistory.splice(lastHuman); turn = playerColor;
        moveCaption.textContent = "已撤销上一手，轮到你落子"; render();
        playTone(280,.06,"sine",.03);
      }

      function render() {
        const winningSet = new Set(winCells);
        cells.forEach((cell, idx) => {
          const value = board[idx];
          const row = Math.floor(idx / SIZE), col = idx % SIZE;
          const label = COL_LABELS[col] + (row + 1);
          if (value) cell.dataset.color = String(value); else delete cell.dataset.color;
          cell.classList.toggle("last", moveHistory.length > 0 && moveHistory[moveHistory.length - 1].idx === idx);
          cell.classList.toggle("winner", winningSet.has(idx));
          cell.classList.toggle("hint", hintIndex === idx);
          const piece = value === HUMAN ? "黑棋" : value === AI ? "白棋" : "空位";
          cell.setAttribute("aria-label", label + "，" + piece);
          cell.disabled = Boolean(value) || gameOver || thinking || turn !== playerColor;
        });
        statusStone.className = "mini-stone " + (turn === HUMAN ? "black" : "white");
        if (gameOver) {
          if (winCells.length) {
            const winner = board[winCells[0]];
            statusText.textContent = winner === playerColor ? "你赢得本局" : "电脑赢得本局";
            thinkingText.textContent = "点击新对局再来一盘";
          } else {
            statusText.textContent = "本局和棋"; thinkingText.textContent = "棋盘已满";
          }
        } else if (thinking) {
          statusText.textContent = "电脑正在思考"; thinkingText.textContent = difficultyLabel() + "思考中";
        } else {
          statusText.textContent = turn === playerColor ? "轮到你落子" : "等待电脑落子";
          thinkingText.textContent = turn === playerColor
            ? (playerColor === HUMAN ? "你执黑" : "你执白") + " · 第 " + (moveHistory.length + 1) + " 手"
            : "电脑回合";
        }
        thinkingText.classList.toggle("active", thinking);
        undoBtn.disabled = gameOver || !moveHistory.some(move => move.color === playerColor);
        hintBtn.disabled = gameOver || thinking || turn !== playerColor;
        document.querySelectorAll("#tacticGroup button").forEach(btn => {
          btn.disabled = gameOver || thinking || turn !== playerColor;
          btn.classList.toggle("active", activeTactic === btn.dataset.tactic && hintIndex >= 0);
        });
        renderHistory();
      }

      function renderHistory() {
        moveCountEl.textContent = moveHistory.length + " 手";
        if (!moveHistory.length) {
          moveListEl.innerHTML = '<div class="move-empty">尚未落子</div>'; return;
        }
        moveListEl.innerHTML = moveHistory.map((move, index) => {
          const colorName = move.color === HUMAN ? "黑方" : "白方";
          const side = move.color === playerColor ? "你" : "电脑";
          const tactic = move.tactics && move.tactics.length ? '<span class="move-tactic">' + formatTacticNames(move.tactics, 1) + '</span>' : '';
          return '<div class="move-item"><span class="move-index">' + (index + 1) +
            '</span><span class="move-player"><span class="move-dot ' +
            (move.color === HUMAN ? "black" : "white") + '"></span>' +
            colorName + ' · ' + side + tactic + '</span><span class="move-pos">' +
            positionLabel(move.idx) + '</span></div>';
        }).join("");
        moveListEl.scrollTop = moveListEl.scrollHeight;
      }

      function difficultyLabel() {
        return getLevelConfig().label;
      }

      function positionLabel(idx) {
        const row = Math.floor(idx / SIZE), col = idx % SIZE;
        return COL_LABELS[col] + (row + 1);
      }

      function showToast(message) {
        clearTimeout(toastTimer); toastEl.textContent = message; toastEl.classList.add("show");
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2300);
      }

      function ensureAudio() {
        if (!audioCtx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return null;
          audioCtx = new AudioCtor();
        }
        if (!musicGain) {
          musicGain = audioCtx.createGain();
          musicGain.gain.value = .22;
          musicGain.connect(audioCtx.destination);
        }
        return audioCtx;
      }

      function startBackgroundMusic() {
        if (!musicEnabled || gameOver || musicActive) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const begin = () => {
          if (!musicEnabled || gameOver || musicActive || (ctx.state && ctx.state !== "running")) return;
          musicActive = true; musicStep = 0;
          musicGain.gain.cancelScheduledValues(ctx.currentTime);
          musicGain.gain.setTargetAtTime(.22, ctx.currentTime, .12);
          scheduleMusicBar();
          musicTimer = window.setInterval(scheduleMusicBar, 4200);
        };
        if (ctx.state === "suspended" && ctx.resume) {
          ctx.resume().then(begin).catch(() => {});
        } else begin();
      }

      function stopBackgroundMusic() {
        if (musicTimer) window.clearInterval(musicTimer);
        musicTimer = 0; musicActive = false;
        if (audioCtx && musicGain) {
          musicGain.gain.cancelScheduledValues(audioCtx.currentTime);
          musicGain.gain.setTargetAtTime(.0001, audioCtx.currentTime, .08);
        }
      }

      function scheduleMusicBar() {
        if (!musicActive || !musicEnabled || gameOver || !audioCtx) return;
        const chords = [
          [220.00,261.63,329.63],
          [174.61,220.00,261.63],
          [196.00,246.94,293.66],
          [164.81,196.00,246.94]
        ];
        const start = audioCtx.currentTime + .05;
        const chord = chords[musicStep % chords.length];
        chord.forEach((frequency, index) => {
          scheduleMusicTone(frequency / 2, start + index * .08, 3.9, "sine", .034);
        });
        scheduleMusicTone(chord[(musicStep * 2) % chord.length] * 2, start + 1.25, .7, "triangle", .026);
        scheduleMusicTone(chord[(musicStep + 1) % chord.length] * 2, start + 2.75, .8, "triangle", .022);
        musicStep++;
      }

      function scheduleMusicTone(frequency, start, duration, type, volume) {
        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.linearRampToValueAtTime(volume, start + Math.min(.5, duration * .22));
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain); gain.connect(musicGain);
        oscillator.start(start); oscillator.stop(start + duration + .05);
      }

      function playTone(frequency, duration, type, volume) {
        if (!soundEnabled) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const oscillator = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          oscillator.type = type; oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(volume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
          oscillator.connect(gain); gain.connect(audioCtx.destination);
          oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
        } catch (_) {}
      }

      function playVictory(humanWon) {
        const notes = humanWon ? [523,659,784,1046] : [392,349,294,233];
        notes.forEach((note, i) => setTimeout(() => playTone(note,.14,"sine",.05), i * 110));
      }
    })();
  </script>
</body>
